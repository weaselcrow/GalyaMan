*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#06050c;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:"PS2P",monospace;color:#cfd8ff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#pad{position:fixed;left:0;right:0;bottom:0;height:0;display:none;z-index:5}
body.touch #pad{display:block}
.tb{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));border-radius:14px;
  border:3px solid rgba(255,255,255,.55);background:rgba(20,26,54,.42);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.tb.on{background:rgba(255,255,255,.4)}
#bd{left:calc(14px + env(safe-area-inset-left));bottom:calc(100px + env(safe-area-inset-bottom));width:80px;height:44px;font-size:10px}
#dpad{left:calc(14px + env(safe-area-inset-left));width:168px;height:76px;justify-content:space-around}
#bj{right:calc(14px + env(safe-area-inset-right));width:80px;height:80px;border-radius:50%;font-size:11px}
#ba{right:calc(108px + env(safe-area-inset-right));width:80px;height:80px;border-radius:50%;font-size:11px;
  border-color:rgba(255,120,120,.8)}
#bm{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));
  width:34px;height:34px;border-radius:8px;border:2px solid rgba(255,255,255,.35);background:rgba(20,26,54,.4);
  color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;z-index:6}
body.touch #bm{display:flex}
#rot{position:fixed;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));text-align:center;
  font-size:8px;line-height:1.8;color:#8f9ad0;display:none;padding:0 16px}
@media (orientation:portrait){
  #wrap{align-items:flex-start;padding-top:14vh}
  body.touch #rot{display:block}
}
</style>

// ---------- rabbits ----------
function updateRabbits(dt) {
  for (let i = L.rabbits.length - 1; i >= 0; i--) {
    const r = L.rabbits[i];
    if (r.dead) { L.rabbits.splice(i, 1); continue; }
    r.t += dt; r.born += dt;
    if (r.bub) { r.bub.t -= dt; if (r.bub.t <= 0) r.bub = null; }
    if (r.ko > 0) {
      r.ko -= dt; r.x += r.koDir * 130 * dt; r.y -= 150 * dt * (r.ko > .06 ? 1 : -.4);
      if (r.ko <= 0) killRabbit(r, r.koDir);
      continue;
    }
    if (!inView(r.x, 260)) continue;
    const dx = P.x - r.x, dist = Math.abs(dx), near = Math.abs(P.y - r.y) < 130;
    if (!r.said && dist < 215 && near && r.line && mode === 'play') { r.said = true; say(r, r.line, 2.8); sfx.blip(); }
    if (r.kind === 'run') {
      if (r.state !== 'flee' && dist < 205 && near) { r.state = 'flee'; sfx.squeak(); }
      if (r.state === 'flee') {
        const dir = dx > 0 ? -1 : 1; r.face = dir;
        const ahead = r.x + dir * 22;
        const blocked = (r.onGround && !groundBelow(ahead, r.y)) || r.hitWall || L.zaps.some(z => Math.abs(z.x - ahead) < 14);
        if (blocked) { r.state = 'corner'; r.vx = 0; if (!r.said2) { r.said2 = true; say(r, pick(['тупик!', 'ой-ой', 'я передумал бежать']), 1.6); } }
        else r.vx = dir * 150;
        if (dist > 360) { r.state = 'idle'; r.vx = 0; }
      } else { r.vx = 0; if (r.state === 'corner') { r.face = sign(dx); if (dist > 300) r.state = 'idle'; } else r.face = sign(dx); }
    } else if (r.kind === 'support') {
      if (Math.abs(r.x - r.tx) > 8) { r.state = 'flee'; r.face = sign(r.tx - r.x); r.vx = r.face * 170; }
      else { r.state = 'offer'; r.vx = 0; r.face = sign(boss.x - r.x); }
    } else {
      r.face = sign(dx); r.vx = 0;
      if (r.kind === 'give') r.state = (dist < 240 && near) ? 'offer' : 'idle';
      else r.state = (dist < 150 && near) ? 'scared' : 'idle';
      if (!r.said2 && r.said && dist < 70 && near && !r.bub) { r.said2 = true; say(r, pick(['не надо…', 'пожалуйста', 'я хороший', 'давай обсудим']), 1.4); }
    }
    r.vy += GRAV * dt; collide(r, dt);
    if (r.y > H + 80) { r.dead = true; }
  }
}

}

// ---------- main loop ----------
function step(dt) {

  if (fadeDir) { fade += fadeDir * dt * 2.6; if (fade >= 1 && fadeDir === 1) { fade = 1; fadeDir = -1; const cb = fadeCb; fadeCb = null; if (cb) cb(); } else if (fade <= 0) { fade = 0; fadeDir = 0; } }

    case 'select': {
      const n = slotCount(); let ok = hit('S') || hit('A');

      if (hit('D')) { selI = (selI + 3) % n; sfx.select(); } if (hit('J')) { selI = (selI + n - 3) % n; sfx.select(); }
      if (hit('T')) { const row0 = Math.max(0, Math.min((selI / 3 | 0) - 1, Math.ceil(n / 3) - 2)); for (let i = 0; i < 6; i++) { const r = slotRect(i); if (tapX > r[0] && tapX < r[0] + r[2] && tapY > r[1] && tapY < r[1] + r[3]) { selI = row0 * 3 + i; ok = true; } } }
      if (sceneT > .4 && ok && !fadeDir) { if (LEVELS[selI] && selI < unlocked) { sfx.ok(); const i = selI; fadeTo(() => startLevel(i)); } else sfx.buzz(); }
      break;
    }
    case 'play': updatePlay(dt * slow); break;
    case 'bossintro':
      if (sceneT > .9 && sceneT < 1.8 && ((sceneT - .9) * 9 | 0) !== ((sceneT - dt - .9) * 9 | 0)) sfx.blip();
      if (sceneT > 2 && sceneT - dt <= 2) { [1047, 1319, 1568, 2093].forEach((f, i) => tn('sine', f, f, .3, .15, i * .08)); }
      if ((sceneT > 4.4 || (sceneT > 1.2 && go)) && !fadeDir) fadeTo(startBoss);
      break;
    case 'ending':
      if (!credits) { if (sceneT > 9 && go) { credits = makeCredits(); sfx.ok(); } }
      else if ((credits.done || sceneT - credits.t0 > 8) && go && !fadeDir) fadeTo(() => { credits = null; stopSong(); curLevel = 0; newGame(); scene = 'select'; sceneT = 0; selI = Math.min(unlocked, LEVELS.length) - 1; });

}
let lastTs = 0, acc = 0;
const STEP = 1 / 60;

  if (hit('P')) { if (scene === 'play') paused = !paused; pressed.P = false; }
  if (!paused) {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 5) { step(STEP); acc -= STEP; n++; for (const k in pressed) pressed[k] = false; anyPress = false; }
    if (n === 5) acc = 0;
  } else { for (const k in pressed) pressed[k] = false; anyPress = false; }
  render(); musicTick();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play' && mode === 'play') paused = true; });

Promise.all([loadImg(A.atlas), loadImg(A.bg1), loadImg(A.bg2), (document.fonts && document.fonts.load ? Promise.race([document.fonts.load('10px PS2P', 'Галя Men 123'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve())])
  .then(r => { atlas = r[0]; bg1 = r[1]; bg2 = r[2]; buildArt(); newGame(); scene = 'title'; sceneT = 0; })
  .catch(e => { console.error(e); });
requestAnimationFrame(frame);

window.__dbg = {
  get s() { return { scene, mode, x: P.x, y: P.y, hp: P.hp, kills: stats && stats.kills, hats: stats && stats.hats, boss: boss && { hp: boss.hp, state: boss.state, phase: boss.phase, x: boss.x }, cam, rabbits: L && L.rabbits.length, chain, fade }; },
  warp(x, y) { P.x = x; P.y = y === undefined ? FY : y; P.vx = P.vy = 0; cam = clamp(x - 360, 0, L.w - W); },
  god(v) { P.maxhp = v ? 99 : 5; P.hp = P.maxhp; },
  start() { startLevel(0); }, tikhon() { startTikhon(); }, cele(k) { cele.n = 4; startCelebrate(); if (k) cele.kind = k; }, idle(k) { P.idleT = 4; P.idleAnim = k; P.idleA = 0; }, boss() { startBoss(); }, bosshp(n) { boss.hp = n; }, ending() { startEnding(); },
  skip() { iceSeen = true; fallCase = true; }, L: () => L, P, songs: SONGS, n2f: N2F, audio: () => AC && { state: AC.state, song: song && song.name }
