*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#06050c;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:"PS2P",monospace;color:#cfd8ff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#pad{position:fixed;left:0;right:0;bottom:0;height:0;display:none;z-index:5}
body.touch #pad{display:block}
.tb{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));border-radius:14px;
  border:3px solid rgba(255,255,255,.55);background:rgba(20,26,54,.42);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.tb.on{background:rgba(255,255,255,.4)}
#bd{left:calc(14px + env(safe-area-inset-left));bottom:calc(100px + env(safe-area-inset-bottom));width:80px;height:44px;font-size:10px}
#dpad{left:calc(14px + env(safe-area-inset-left));width:168px;height:76px;justify-content:space-around}
#bj{right:calc(14px + env(safe-area-inset-right));width:80px;height:80px;border-radius:50%;font-size:11px}
#ba{right:calc(108px + env(safe-area-inset-right));width:80px;height:80px;border-radius:50%;font-size:11px;
  border-color:rgba(255,120,120,.8)}
#bm{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));
  width:34px;height:34px;border-radius:8px;border:2px solid rgba(255,255,255,.35);background:rgba(20,26,54,.4);
  color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;z-index:6}
body.touch #bm{display:flex}
#rot{position:fixed;left:0;right:0;bottom:calc(170px + env(safe-area-inset-bottom));text-align:center;
  font-size:8px;line-height:1.8;color:#8f9ad0;display:none;padding:0 16px}
@media (orientation:portrait){
  #wrap{align-items:flex-start;padding-top:14vh}
  body.touch #rot{display:block}
}
</style>

<script>
'use strict';
(function(){
// ГАЛЯ МЕН — шуточный платформер. Один файл, без зависимостей.
const A = window.__ASSETS, F = A.frames;
const W = 800, H = 450, FY = 386, FYB = 398;
const TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (TOUCH) document.body.classList.add('touch');

// ---------- utils ----------
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sign = v => v < 0 ? -1 : 1;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- canvases ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;
let K = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const portrait = innerHeight > innerWidth;
  const availH = portrait ? innerHeight * 0.6 : innerHeight;
  const s = Math.min(innerWidth / W, availH / H);
  const cw = Math.max(160, Math.floor(W * s)), ch = Math.max(90, Math.floor(H * s));
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  K = cv.width / W;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

// ---------- input ----------
const held = {}, pressed = {};
let anyPress = false;
const KEYMAP = {
  ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R',
  ArrowUp: 'J', KeyW: 'J', Space: 'J', KeyZ: 'J',
  KeyX: 'A', KeyJ: 'A', KeyK: 'A', KeyF: 'A', ControlLeft: 'A', ControlRight: 'A',
  ArrowDown: 'D', KeyS: 'D', Enter: 'S', NumpadEnter: 'S', KeyM: 'M', KeyP: 'P', Escape: 'P'
};
function press(k) { if (!held[k]) pressed[k] = true; held[k] = true; if (k !== 'M' && k !== 'P') anyPress = true; audioInit(); }
function release(k) { held[k] = false; }
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (!e.repeat) press(k); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); release(k); } });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
const hit = k => !!pressed[k];
const down = k => !!held[k];

// touch buttons
function bindBtn(el, k) {
  const on = e => { e.preventDefault(); el.classList.add('on'); press(k); };
  const off = e => { e.preventDefault(); el.classList.remove('on'); release(k); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindBtn(document.getElementById('bj'), 'J');
bindBtn(document.getElementById('ba'), 'A');
bindBtn(document.getElementById('bd'), 'D');
(function () {
  const el = document.getElementById('dpad'); let pid = null;
  const set = e => {
    const r = el.getBoundingClientRect(); const left = (e.clientX - r.left) < r.width / 2;
    if (left) { if (!held.L) press('L'); release('R'); } else { if (!held.R) press('R'); release('L'); }
    el.classList.add('on');
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; try { el.setPointerCapture(pid); } catch (_) { } set(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === pid) { e.preventDefault(); set(e); } });
  const end = e => { if (e.pointerId === pid) { pid = null; release('L'); release('R'); el.classList.remove('on'); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
})();
document.getElementById('bm').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); toggleMute(); });
// tap / click on the game itself
let tapX = -1, tapY = -1;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const r = cv.getBoundingClientRect();
  tapX = (e.clientX - r.left) / r.width * W; tapY = (e.clientY - r.top) / r.height * H;
  pressed.T = true; anyPress = true;
  if (e.pointerType === 'mouse') press('A');
});
cv.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') release('A'); });
addEventListener('contextmenu', e => e.preventDefault());

// ---------- audio ----------
let AC = null, master, musG, sfxG, noiseBuf, muted = false, song = null, wantSong = null;
const N2F = {};
['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'].forEach((n, i) => { for (let o = 1; o <= 7; o++) N2F[n + o] = 440 * Math.pow(2, (o - 4) + (i - 9) / 12); });
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(AC.destination);
  musG = AC.createGain(); musG.gain.value = 0.5; musG.connect(master);
  sfxG = AC.createGain(); sfxG.gain.value = 0.9; sfxG.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  if (wantSong) { const s = wantSong; wantSong = null; playSong(s); }
}
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55; document.getElementById('bm').style.opacity = muted ? .4 : 1; }
function tn(type, f0, f1, dur, vol, when, dest) {
  if (!AC) return; const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), gn = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(gn); gn.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.03);
}
function nz(when, dur, vol, type, f0, f1, q, dest) {
  if (!AC) return; const t = AC.currentTime + (when || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;

function collide(e, dt) {
  const hw = e.w / 2;
  e.hitWall = false;
  e.x += e.vx * dt;
  for (const s of L.solids) {
    if (s.k === 'p') continue;
    if (e.x + hw > s.x && e.x - hw < s.x + s.w && e.y > s.y + 0.01 && e.y - e.h < s.y + s.h) {
      if (e.vx > 0) e.x = s.x - hw; else if (e.vx < 0) e.x = s.x + s.w + hw;
      else e.x = (e.x < s.x + s.w / 2) ? s.x - hw : s.x + s.w + hw;
      e.vx = 0; e.hitWall = true;
    }
  }
  const prev = e.y; e.y += e.vy * dt; e.onGround = false; e.ground = null;
  for (const s of L.solids) {
    if (!(e.x + hw > s.x + 0.01 && e.x - hw < s.x + s.w - 0.01)) continue;
    if (s.k === 'p') { if (e.vy >= 0 && prev <= s.y + 3 && e.y >= s.y) { e.y = s.y; e.vy = 0; e.onGround = true; e.ground = s; } }
    else if (e.y > s.y && e.y - e.h < s.y + s.h) {
      if (e.vy >= 0 && prev <= s.y + 10) { e.y = s.y; e.vy = 0; e.onGround = true; e.ground = s; }
      else if (e.vy < 0) { e.y = s.y + s.h + e.h; e.vy = 0; }
    }
  }
}

      for (const sd of [-1, 1]) G({ k: 'e', r: Math.max(3, Math.round(4.4 * scale)), x: x + sd * 30 * scale, y: y + 8 * scale, vx: sd * rnd(160, 300), vy: -rnd(60, 180), rot: 0, vr: 0, life: 16 });

  for (let i = 0; i < 2; i++) gibs.push({ k: 'e', r: big ? 10 : Math.max(3, Math.round(4.4 * scale)), x: x + (i ? 5 : -5), y: y - 8 * scale, vx: dir * rnd(50, 230) + rnd(-170, 170), vy: -rnd(280, big ? 640 : 470), rot: 0, vr: 0, rest: false, life: big ? 60 : 16, tr: 0 });
  for (let i = 0; i < 2; i++) gibs.push({ k: 'ear', x, y: y - 16 * scale, vx: rnd(-200, 200) + dir * 80, vy: -rnd(260, big ? 600 : 460), rot: rnd(6.28), vr: rnd(-16, 16), sc: scale * (big ? 3 : 1), rest: false, life: big ? 60 : 16, tr: 0 });
  for (let i = 0; i < (big ? 26 : 5); i++) gibs.push({ k: 'm', x, y, vx: rnd(-240, 240) * (big ? 2 : 1) + dir * 60, vy: -rnd(140, big ? 620 : 400), rot: rnd(6.28), vr: rnd(-10, 10), sc: rnd(.8, 1.5) * (big ? 1.8 : 1), c: pick(['#e0525c', '#c2121f', '#f08a94']), rest: false, life: big ? 40 : 12, tr: 0 });

function burst(x, y, n, cols, sp, life, grav) { for (let i = 0; i < n; i++) { const a = rnd(6.28), v = rnd(sp * .3, sp); parts.push({ k: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, s: rint(1, 3), c: pick(cols), life: rnd(life * .5, life), g: grav === undefined ? 600 : grav }); } }
function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.vy += (p.k === 'b' ? 980 : p.g) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    let kill = p.life <= 0 || p.y > H + 30;
    if (!kill && p.k === 'b') {
      const s = solidAt(p.x, p.y);
      if (s && !(s.k === 'p' && p.vy < 0)) {
        kill = true;
        if (!s.hid) { if (p.y - p.vy * dt <= s.y + 4) addStain(p.x - 1, s.y, rint(2, 5), rint(2, 3), p.c); else if (s.k !== 'p') addStain(p.x < s.x + s.w / 2 ? s.x : s.x + s.w - 2, p.y, 2, rint(3, 8), p.c); }
        else if (L.boss && p.y >= L.fy - 2) addStain(p.x - 1, L.fy + rint(-10, 6), rint(3, 6), 2, p.c);
      }
    }
    if (kill) { parts[i] = parts[parts.length - 1]; parts.pop(); }
  }
  for (let i = gibs.length - 1; i >= 0; i--) {
    const q = gibs[i]; q.life -= dt;
    if (q.life <= 0 || q.y > H + 60) { gibs.splice(i, 1); continue; }
    if (q.k === 'legs') {
      q.t -= dt; q.x += q.dir * 150 * dt;
      for (let j = 0; j < 3; j++) parts.push({ k: 'b', x: q.x + rnd(-5, 5), y: q.y - 22 * q.sc, vx: rnd(-90, 90), vy: -rnd(200, 460), s: rint(2, 3), c: pick(BLOOD), life: 2 });
      if (q.t <= 0 || !groundBelow(q.x, q.y)) { for (let j = 0; j < 20; j++) parts.push({ k: 'b', x: q.x, y: q.y - 12, vx: rnd(-200, 200), vy: -rnd(60, 300), s: rint(2, 3), c: pick(BLOOD), life: 2 }); gibs.push({ k: 'c', cv: q.cv, x: q.x, y: q.y - 6, vx: q.dir * 60, vy: -160, rot: 0, vr: q.dir * 9, sc: q.sc, rest: false, life: 20, tr: 0 }); gibs.splice(gibs.indexOf(q), 1); }
      continue;
    }
    if (q.k === 'pelt') continue;
    if (q.rest) { if (!groundBelow(q.x, q.y + 1)) q.rest = false; continue; }
    q.vy += 1100 * dt; q.x += q.vx * dt;
    let s = solidAt(q.x, q.y - 3); if (s && s.k !== 'p') { q.x -= q.vx * dt; q.vx *= -0.5; }
    q.y += q.vy * dt; q.rot += q.vr * dt;
    q.tr -= dt; if (q.tr <= 0 && !q.rest && q.k !== 'sock') { q.tr = .03; parts.push({ k: 'b', x: q.x, y: q.y, vx: rnd(-20, 20), vy: rnd(-20, 30), s: 2, c: pick(BLOOD), life: .8 }); }
    s = solidAt(q.x, q.y);
    if (s && q.vy > 0 && q.y - q.vy * dt <= s.y + 6) {
      q.y = s.y; if (!s.hid && q.k !== 'sock') addStain(q.x - 3, s.y, rint(4, 8), 3);
      if (Math.abs(q.vy) < 120) { q.rest = true; q.vy = 0; q.vx = 0; q.vr = 0; if (q.k === 'c' || q.k === 'ear' || q.k === 'sock') q.rot = Math.round(q.rot / (Math.PI / 2)) * (Math.PI / 2); }
      else { q.vy *= -(q.k === 'e' ? .62 : .4); q.vx *= .7; q.vr *= .6; }
    }
    if (L.boss) { if (q.x < 14) { q.x = 14; q.vx = Math.abs(q.vx) * .6; } if (q.x > W - 14) { q.x = W - 14; q.vx = -Math.abs(q.vx) * .6; } }
  }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; f.y += f.vy * dt; if (f.t > f.max) floats.splice(i, 1); }
  for (let i = lens.length - 1; i >= 0; i--) { const l = lens[i]; l.t += dt; if (l.t > l.max) lens.splice(i, 1); }
  for (const p of pools) if (p.w < p.max) p.w += 26 * dt;
  for (const s of splats) for (const d of s.dr) if (d.len < d.max) d.len += d.sp * dt;
  for (let i = souls.length - 1; i >= 0; i--) { const o = souls[i]; o.t += dt; o.y -= 24 * dt; if (o.t > 3.4) souls.splice(i, 1); }

      const dx = P.x - p.x, dy = (P.y - 50) - p.y, d = Math.hypot(dx, dy) || 1, sp = 300 + p.t * 500;
      p.x += dx / d * sp * dt; p.y += dy / d * sp * dt;

      continue;
    }
    if (!p.rest) {
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const s = solidAt(p.x, p.y);
      if (s && p.vy > 0) { p.y = s.y; if (p.vy < 130) { p.rest = true; p.vx = 0; } else { p.vy *= -.4; p.vx *= .6; } }
      if (L.boss) p.x = clamp(p.x, 24, W - 24);
      if (p.y > H + 40) { pickups.splice(i, 1); continue; }
    }
    if (p.k !== 'hat' && p.t > .35 && Math.abs(p.x - P.x) < 26 && p.y > P.y - 84 && p.y - 20 < P.y && mode === 'play') {
      pickups.splice(i, 1);
      if (p.k === 'heart') { P.hp = Math.min(P.maxhp, P.hp + 1); sfx.heal(); floater('+1', P.x, P.y - 90, { color: '#ff5b6b' }); }
      else if (p.k === 'cone') { P.hp = Math.min(P.maxhp, P.hp + 2); sfx.heal(); floater('ПЛОМБИР!', P.x, P.y - 92, { color: '#ffd0e8' }); }
      else if (p.k === 'pot') { P.hp = P.maxhp; sfx.heal(); floater('РАГУ. ИЗ КОГО — НЕВАЖНО', P.x, P.y - 96, { color: '#ffb35b', t: 2.2, size: 9 }); }
      else if (p.k === 'carrot') { stats.carrots++; sfx.ok(); floater('ОТОБРАНА', P.x, P.y - 90, { color: '#ffa033', size: 8 }); }
    }
  }
}

// ---------- kills ----------
function killRabbit(r, dir) {
  r.dead = true; stats.kills++;
  const cx = r.x, cy = r.y - 20 * r.scale;
  gore(cx, cy, dir, r.scale, false, r.fin || 'burst');
  wallSplat(cx, cy - 6); if (r.fin === 'launch') wallSplat(cx, cy - 40);
  addPool(cx, r.fin === 'launch' ? r.y + 260 : r.y, r.scale);
  if (Math.random() < .45) lensSplat(rint(1, 2));
  shake = Math.max(shake, 7); sfx.splat();
  pickups.push({ k: 'hat', x: cx, y: cy, vx: rnd(-40, 40), vy: -330, t: 0, rest: false });
  if (r.kind === 'give') pickups.push({ k: 'carrot', x: cx, y: cy, vx: dir * 90, vy: -260, t: 0, rest: false });
  memorial.push([r.name, r.epi]);
  floater('ПРОЩАЙ, ' + r.name.toUpperCase(), cx, cy - 46, { color: '#ff8a94', size: 8, t: 1.6, vy: -22 });
  if (boss && !boss.dead && L.boss) { boss.grief = 1.6; say(boss, (r.name + '!!! НЕЕЕТ!').toUpperCase(), 1.6); sfx.scream(.6); }
  chain++; chainT = 3.6; stats.best = Math.max(stats.best, chain);
  if (chain % 4 === 0) { pendingCele = true; cele.n = chain; }
  if (Math.random() < .35) souls.push({ x: cx, y: cy, t: 0, sc: r.scale, s: pick(['я тебя прощаю, Галина…', 'зла не держу, Галина', 'из меня выйдет хорошая шапка, Галина', 'спасибо, Галина. дома было хуже', 'тебя прощаю, Галина. жену — нет', 'носи меня с гордостью, Галина', 'увидимся в рагу, Галина']) });
  else if (!P.bub) {
    const z = Math.random();
    if (z < .3) { P.emote = 'laugh'; P.emoteT = .75; say(P, pick(['АХАХАХА!', 'ХЕ-ХЕ-ХЕ', 'ХА! ХА!', 'ЫХЫХЫ']), 1); sfx.laugh(5, rnd(520, 640)); }

}
function doBark() {

}

// ---------- suitcases ----------
function openCase(c, dir) {
  if (c.open) return; c.open = true; c.bump = .2; sfx.click(); shake = Math.max(shake, 3);
  if (c.main) { stats.cases++; floater('ЧЕМОДАН ' + stats.cases + '/' + stats.casesTotal, c.x, c.y - 64, { color: '#ffe36b', size: 8, t: 1.5 }); }
  const x = c.x, y = c.y - 20 * c.scale;
  burst(x, y, 10, ['#fff', '#ffe36b', '#d9d2b0'], 160, .5);
  switch (c.content) {
    case 'socks':
      for (let i = 0; i < 7; i++) gibs.push({ k: 'sock', x, y, vx: rnd(-170, 170), vy: -rnd(240, 440), rot: rnd(6.28), vr: rnd(-12, 12), sc: 1, c: pick(['#e84a5f', '#4ab0e8', '#f3c93a', '#7fbf6d', '#fff']), rest: false, life: 14, tr: 9 });
      floater('НОСКИ. ОДНИ НОСКИ.', x, y - 26, { size: 8, t: 1.8 }); break;
    case 'heart': pickups.push({ k: 'heart', x, y, vx: dir * 40, vy: -300, t: 0 }); break;
    case 'carrots': for (let i = 0; i < 3; i++) pickups.push({ k: 'carrot', x, y, vx: rnd(-90, 90), vy: -rnd(240, 360), t: 0 }); floater('ВЕСЬ ЕГО БАГАЖ', x, y - 26, { size: 8, t: 1.8 }); break;
    case 'hats': for (let i = 0; i < 3; i++) pickups.push({ k: 'hat', x: x + i * 8 - 8, y, vx: rnd(-60, 60), vy: -rnd(260, 380), t: -i * .12 }); floater('ШАПКИ ПРО ЗАПАС', x, y - 26, { size: 8, t: 1.8 }); break;
    case 'matryoshka':
      if (c.scale > .42) { const n = mkCase(x + dir * 6, y, 'matryoshka', (c.ci + 1) % 5, c.scale * .7, false); n.fall = true; n.vy = -330; n.vx = dir * 70; L.cases.push(n); floater(c.scale === 1 ? 'ЧЕМОДАН В ЧЕМОДАНЕ' : '…В ЧЕМОДАНЕ', x, y - 26, { size: 8, t: 1.5 }); }
      else { pickups.push({ k: 'hat', x, y, vx: 0, vy: -300, t: 0 }); floater('ШАПКА ДЛЯ МИЗИНЦА', x, y - 26, { size: 8, t: 1.8 }); }
      break;
    case 'rabbit': {
      const r = mkRabbit(x, y, 'sit', c.fallen ? 'десант не удался' : 'занято! я тут с 2019-го прячусь'); r.vy = -340; r.onGround = false; r.said = true; say(r, r.line, 2.2); L.rabbits.push(r); L.rabTotal++; sfx.squeak(); break;
    }
    case 'letter': letterT = 4.2; sfx.blip2(); break;
    default: floater('ПУСТО. КАК В ДУШЕ У ГАЛИ', x, y - 26, { size: 8, t: 2 });
  }
}

// ---------- rabbits ----------
function updateRabbits(dt) {
  talkCd -= dt;
  for (let i = L.rabbits.length - 1; i >= 0; i--) {
    const r = L.rabbits[i];
    if (r.dead) { L.rabbits.splice(i, 1); continue; }
    r.t += dt; r.born += dt;
    if (r.bub) { r.bub.t -= dt; if (r.bub.t <= 0) r.bub = null; }
    if (r.ko > 0) {
      r.ko -= dt;
      if (r.fin === 'launch') { r.x += r.koDir * 150 * dt; r.y -= 640 * dt; r.rot += 24 * dt; for (let i = 0; i < 3; i++) parts.push({ k: 'b', x: r.x + rnd(-6, 6), y: r.y - 20, vx: rnd(-60, 60), vy: rnd(0, 120), s: rint(2, 3), c: pick(BLOOD), life: 2 }); }
      else if (r.fin === 'flat') { if (Math.random() < .5) parts.push({ k: 'b', x: r.x, y: r.y - 4, vx: (Math.random() < .5 ? -1 : 1) * rnd(120, 420), vy: -rnd(10, 120), s: rint(2, 4), c: pick(BLOOD), life: 2 }); }
      else { r.x += r.koDir * 130 * dt; r.y -= 150 * dt * (r.ko > .06 ? 1 : -.4); }
      if (r.ko <= 0) killRabbit(r, r.koDir);
      continue;
    }
    if (!inView(r.x, 260)) continue;
    const dx = P.x - r.x, dist = Math.abs(dx), near = Math.abs(P.y - r.y) < 130;
    if (!r.said && dist < 215 && near && r.line && mode === 'play' && talkCd <= 0) { r.said = true; say(r, r.line, 1.7 + r.line.length * .07); sfx.blip(); talkCd = 1; }
    if (r.kind === 'run') {
      if (r.state === 'idle' && dist < 205 && near) { r.state = 'flee'; sfx.squeak(); }
      if (r.state === 'flee') {
        const dir = dx > 0 ? -1 : 1; r.face = dir;
        const ahead = r.x + dir * 22;
        const blocked = (r.onGround && !groundBelow(ahead, r.y)) || r.hitWall || L.zaps.some(z => Math.abs(z.x - ahead) < 14);
        if (blocked) { r.state = 'corner'; r.vx = 0; if (!r.said2) { r.said2 = true; say(r, pick(['тупик. как всегда', 'бежать некуда. как дома', 'я передумал. давай дружить']), 1.6); } }
        else r.vx = dir * 150;
        if (dist > 360) { r.state = 'idle'; r.vx = 0; }
      } else { r.vx = 0; if (r.state === 'corner') { r.face = sign(dx); if (dist > 300) r.state = 'idle'; } else r.face = sign(dx); }
    } else if (r.kind === 'support') {
      if (Math.abs(r.x - r.tx) > 8) { r.state = 'flee'; r.face = sign(r.tx - r.x); r.vx = r.face * 170; }
      else { r.state = 'offer'; r.vx = 0; r.face = sign(boss.x - r.x); }
    } else {
      r.face = sign(dx); r.vx = 0;
      if (r.kind === 'give') r.state = (dist < 240 && near) ? 'offer' : 'idle';
      else r.state = (dist < 150 && near) ? 'scared' : 'idle';
      if (!r.said2 && r.said && dist < 70 && near && !r.bub) { r.said2 = true; if (Math.random() < .7 && talkCd <= 0) say(r, pick(['не надо…', 'я невкусный', 'у меня справка', 'возьми соседа', 'давай я сам уйду', 'может, в кредит?', 'я отдам тебе жену']), 1.4); }
    }
    r.vy += GRAV * dt; collide(r, dt);
    if (r.y > H + 80) { r.dead = true; }
